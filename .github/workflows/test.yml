name: test

# Every push runs the tests on all three desktops. Windows is where the apps mostly run: it also exercises the
# WSAECONNRESET and exclusive-bind paths. Apps depend on a commit (`rev`), so there are no releases.
on:
  push:
    branches: ['**']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - run: cargo test --all-targets --features autostart

[package]
name = "charon"
version = "0.2.0"
edition = "2024"
description = "Ferries a vehicle's MAVLink stream, from UDP, TCP or a serial port, to the GCS and whatever else listens, with link stats and plugins."
repository = "https://github.com/zgv2-dev/charon"

[dependencies]
auto-launch = { version = "0.6.0", optional = true }
directories = "6.0.0"
mavlink = { version = "0.19.1", default-features = false, features = ["std", "dialect-ardupilotmega"] }
notify-rust = "4.18.2"
serde = { version = "1.0.229", features = ["derive"] }
socket2 = "0.6.5"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-serial = { version = "5.5.0", default-features = false }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"

[features]
# Starting at login is the app's choice: this adds Config::autostart and platform::set_autostart.
autostart = ["dep:auto-launch"]

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
serde_json = "1.0.154"
socket2 = "0.6.5"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "test-util"] }
tracing-subscriber = "0.3.23"

[[example]]
name = "run"

[target."cfg(target_os = \"linux\")".dev-dependencies]
libc = "0.2"

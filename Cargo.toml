[package]
name = "charon"
version = "0.1.0"
edition = "2024"
description = "Ferries a vehicle's MAVLink stream to the GCS and whatever else listens: a UDP router with link stats and plugins."
repository = "https://github.com/zgv2-dev/charon"

[dependencies]
auto-launch = "0.6.0"
directories = "6.0.0"
mavlink = { version = "0.19.1", default-features = false, features = ["std", "dialect-ardupilotmega"] }
notify-rust = "4.18.2"
serde = { version = "1.0.229", features = ["derive"] }
socket2 = "0.6.5"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
serde_json = "1.0.154"
socket2 = "0.6.5"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "test-util"] }
tracing-subscriber = "0.3.23"

[[example]]
name = "run"
